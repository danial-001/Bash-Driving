version: "3.9"

services:
  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    restart: unless-stopped
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
